name: Upload API

on:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'yarn'

      - name: Enable Corapack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.1.0 --activate
          yarn --version # Verify Yarn is installed

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Github Pages
        uses: actions/deploy-pages@v3
